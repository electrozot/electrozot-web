<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Service Worker Test - Electrozot</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5rem;
        }
        
        .test-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            border-radius: 15px;
            padding: 25px;
            margin-bottom: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
        }
        
        .test-card h2 {
            margin-bottom: 15px;
            font-size: 1.5rem;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .status {
            display: inline-block;
            padding: 5px 15px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: bold;
        }
        
        .status.success {
            background: #10b981;
        }
        
        .status.error {
            background: #ef4444;
        }
        
        .status.pending {
            background: #f59e0b;
        }
        
        .info {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 10px;
            margin: 10px 0;
            font-family: 'Courier New', monospace;
            font-size: 0.9rem;
            word-break: break-all;
        }
        
        button {
            background: white;
            color: #667eea;
            border: none;
            padding: 12px 25px;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            margin: 5px;
            transition: all 0.3s;
        }
        
        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .log {
            background: rgba(0, 0, 0, 0.3);
            padding: 15px;
            border-radius: 10px;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.85rem;
        }
        
        .log-entry {
            margin: 5px 0;
            padding: 5px;
            border-left: 3px solid;
        }
        
        .log-entry.success { border-color: #10b981; }
        .log-entry.error { border-color: #ef4444; }
        .log-entry.info { border-color: #3b82f6; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🔧 Service Worker Diagnostic</h1>
        
        <!-- Browser Support -->
        <div class="test-card">
            <h2>
                <span id="support-icon">⏳</span>
                Browser Support
                <span id="support-status" class="status pending">Checking...</span>
            </h2>
            <div class="info" id="support-info">Checking browser support...</div>
        </div>
        
        <!-- Service Worker Status -->
        <div class="test-card">
            <h2>
                <span id="sw-icon">⏳</span>
                Service Worker Status
                <span id="sw-status" class="status pending">Checking...</span>
            </h2>
            <div class="info" id="sw-info">Checking service worker...</div>
            <div style="margin-top: 15px;">
                <button onclick="registerSW()">Register SW</button>
                <button onclick="unregisterSW()">Unregister SW</button>
                <button onclick="updateSW()">Check for Updates</button>
            </div>
        </div>
        
        <!-- File Check -->
        <div class="test-card">
            <h2>
                <span id="file-icon">⏳</span>
                sw.js File Check
                <span id="file-status" class="status pending">Checking...</span>
            </h2>
            <div class="info" id="file-info">Checking if sw.js exists...</div>
            <button onclick="checkSWFile()">Check File</button>
        </div>
        
        <!-- Path Resolution -->
        <div class="test-card">
            <h2>📍 Path Resolution</h2>
            <div class="info">
                <strong>Current URL:</strong> <span id="current-url"></span><br>
                <strong>Base URI:</strong> <span id="base-uri"></span><br>
                <strong>SW Path:</strong> <span id="sw-path"></span><br>
                <strong>Resolved URL:</strong> <span id="resolved-url"></span>
            </div>
        </div>
        
        <!-- Console Log -->
        <div class="test-card">
            <h2>📋 Console Log</h2>
            <div class="log" id="console-log"></div>
            <button onclick="clearLog()">Clear Log</button>
        </div>
    </div>
    
    <script>
        const log = [];
        
        function addLog(message, type = 'info') {
            const timestamp = new Date().toLocaleTimeString();
            log.push({ timestamp, message, type });
            
            const logDiv = document.getElementById('console-log');
            const entry = document.createElement('div');
            entry.className = `log-entry ${type}`;
            entry.textContent = `[${timestamp}] ${message}`;
            logDiv.appendChild(entry);
            logDiv.scrollTop = logDiv.scrollHeight;
            
            console.log(`[${type.toUpperCase()}] ${message}`);
        }
        
        function clearLog() {
            document.getElementById('console-log').innerHTML = '';
            log.length = 0;
            addLog('Log cleared', 'info');
        }
        
        function updateStatus(id, status, icon, text) {
            document.getElementById(`${id}-status`).className = `status ${status}`;
            document.getElementById(`${id}-status`).textContent = text;
            document.getElementById(`${id}-icon`).textContent = icon;
        }
        
        // Check browser support
        function checkSupport() {
            if ('serviceWorker' in navigator) {
                updateStatus('support', 'success', '✅', 'Supported');
                document.getElementById('support-info').textContent = 
                    'Service Workers are supported in this browser!';
                addLog('Service Worker API is supported', 'success');
                return true;
            } else {
                updateStatus('support', 'error', '❌', 'Not Supported');
                document.getElementById('support-info').textContent = 
                    'Service Workers are NOT supported in this browser.';
                addLog('Service Worker API is NOT supported', 'error');
                return false;
            }
        }
        
        // Check service worker status
        async function checkSWStatus() {
            if (!('serviceWorker' in navigator)) return;
            
            try {
                const registration = await navigator.serviceWorker.getRegistration();
                
                if (registration) {
                    updateStatus('sw', 'success', '✅', 'Registered');
                    
                    let info = `Scope: ${registration.scope}\n`;
                    
                    if (registration.active) {
                        info += `State: Active (${registration.active.state})\n`;
                        info += `Script URL: ${registration.active.scriptURL}`;
                    } else if (registration.installing) {
                        info += `State: Installing`;
                    } else if (registration.waiting) {
                        info += `State: Waiting`;
                    }
                    
                    document.getElementById('sw-info').textContent = info;
                    addLog('Service Worker is registered and active', 'success');
                } else {
                    updateStatus('sw', 'error', '❌', 'Not Registered');
                    document.getElementById('sw-info').textContent = 
                        'No service worker registered. Click "Register SW" to register.';
                    addLog('No service worker registered', 'error');
                }
            } catch (error) {
                updateStatus('sw', 'error', '❌', 'Error');
                document.getElementById('sw-info').textContent = `Error: ${error.message}`;
                addLog(`Error checking SW status: ${error.message}`, 'error');
            }
        }
        
        // Register service worker
        async function registerSW() {
            if (!('serviceWorker' in navigator)) {
                addLog('Service Worker not supported', 'error');
                return;
            }
            
            try {
                addLog('Attempting to register service worker...', 'info');
                
                // Use relative path
                const swPath = new URL('./sw.js', document.baseURI).pathname;
                addLog(`Using path: ${swPath}`, 'info');
                
                const registration = await navigator.serviceWorker.register(swPath);
                
                addLog('Service Worker registered successfully!', 'success');
                addLog(`Scope: ${registration.scope}`, 'info');
                
                await checkSWStatus();
            } catch (error) {
                addLog(`Registration failed: ${error.message}`, 'error');
                updateStatus('sw', 'error', '❌', 'Registration Failed');
            }
        }
        
        // Unregister service worker
        async function unregisterSW() {
            if (!('serviceWorker' in navigator)) return;
            
            try {
                const registration = await navigator.serviceWorker.getRegistration();
                
                if (registration) {
                    await registration.unregister();
                    addLog('Service Worker unregistered', 'success');
                    await checkSWStatus();
                } else {
                    addLog('No service worker to unregister', 'info');
                }
            } catch (error) {
                addLog(`Unregister failed: ${error.message}`, 'error');
            }
        }
        
        // Update service worker
        async function updateSW() {
            if (!('serviceWorker' in navigator)) return;
            
            try {
                const registration = await navigator.serviceWorker.getRegistration();
                
                if (registration) {
                    addLog('Checking for updates...', 'info');
                    await registration.update();
                    addLog('Update check complete', 'success');
                } else {
                    addLog('No service worker registered', 'error');
                }
            } catch (error) {
                addLog(`Update failed: ${error.message}`, 'error');
            }
        }
        
        // Check if sw.js file exists
        async function checkSWFile() {
            try {
                addLog('Checking if sw.js file exists...', 'info');
                
                const swPath = new URL('./sw.js', document.baseURI).pathname;
                const response = await fetch(swPath, { method: 'HEAD' });
                
                if (response.ok) {
                    updateStatus('file', 'success', '✅', 'File Exists');
                    document.getElementById('file-info').textContent = 
                        `sw.js found at: ${swPath}\nStatus: ${response.status} ${response.statusText}`;
                    addLog(`sw.js file exists (Status: ${response.status})`, 'success');
                } else {
                    updateStatus('file', 'error', '❌', 'File Not Found');
                    document.getElementById('file-info').textContent = 
                        `sw.js NOT found at: ${swPath}\nStatus: ${response.status} ${response.statusText}`;
                    addLog(`sw.js file NOT found (Status: ${response.status})`, 'error');
                }
            } catch (error) {
                updateStatus('file', 'error', '❌', 'Error');
                document.getElementById('file-info').textContent = `Error: ${error.message}`;
                addLog(`Error checking file: ${error.message}`, 'error');
            }
        }
        
        // Update path information
        function updatePathInfo() {
            const currentUrl = window.location.href;
            const baseUri = document.baseURI;
            const swPath = new URL('./sw.js', document.baseURI).pathname;
            const resolvedUrl = new URL('./sw.js', document.baseURI).href;
            
            document.getElementById('current-url').textContent = currentUrl;
            document.getElementById('base-uri').textContent = baseUri;
            document.getElementById('sw-path').textContent = swPath;
            document.getElementById('resolved-url').textContent = resolvedUrl;
        }
        
        // Initialize
        window.addEventListener('load', async () => {
            addLog('Page loaded, starting diagnostics...', 'info');
            
            checkSupport();
            await checkSWStatus();
            await checkSWFile();
            updatePathInfo();
            
            addLog('Diagnostics complete', 'success');
        });
    </script>
</body>
</html>
