name: 🚀 Deploy PHP Site via SFTP

on:
  push:
    branches:
      - main  # change if your main branch is different

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1 — Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2 — Prepare deployment folder
      - name: Prepare deployment files
        run: |
          mkdir -p temp_deploy
          # Copy all files except .git, .github, node_modules, temp_deploy
          rsync -av --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='temp_deploy' ./ temp_deploy/

      # Step 3 — Confirm files exist
      - name: Check temp_deploy contents
        run: |
          ls -la temp_deploy

      # Step 4 — Direct SFTP upload
      - name: Deploy via SFTP
        uses: appleboy/scp-action@master
        with:
          host: 217.21.84.50
          port: 65002
          username: u848820288
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "temp_deploy/*"
          target: "/public_html/"
          overwrite: true
          strip_components: 1
          tar_exec: false
