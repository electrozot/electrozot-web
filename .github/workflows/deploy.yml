name: 🚀 Deploy PHP Site via SSH/rsync

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy to Hostinger (rsync over SSH)
        uses: easingthemes/ssh-deploy@v4.1.10
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          REMOTE_HOST: 217.21.84.50
          REMOTE_USER: u848820288
          REMOTE_PORT: 65002

          SOURCE: ./
          TARGET: domains/electrozot.in/public_html/

          ARGS: "-avz"

          EXCLUDE: |
            .git
            .github
            node_modules
            DO_NOT_UPLOAD_HERE
