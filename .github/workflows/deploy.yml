name: 🚀 Fast Deploy PHP Site via SFTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deployment files
        run: |
          mkdir -p temp_deploy
          cp -r $(find . -maxdepth 1 -not -name '.git' -not -name '.github' -not -name 'node_modules' -not -name 'temp_deploy') temp_deploy/

      - name: Deploy via SFTP
        uses: appleboy/scp-action@master
        with:
          host: 217.21.84.50
          port: 65002
          username: u848820288
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "temp_deploy/"
          target: "/public_html/"
          overwrite: true
          strip_components: 1
          tar_exec: true
