name: 🚀 Fast Deploy PHP Site via SFTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1 — Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Step 2 — Prepare deployment folder (exclude unnecessary files)
      - name: Prepare deployment files
        run: |
          mkdir -p temp_deploy
          rsync -av --exclude='.git' --exclude='.github' --exclude='node_modules' ./ temp_deploy/

      # Step 3 — Generate a list of changed files
      - name: Generate changed files
        id: changes
        run: |
          git fetch origin main
          git diff --name-only origin/main $GITHUB_SHA > changed_files.txt || true
          echo "::set-output name=files::$(cat changed_files.txt)"

      # Step 4 — Deploy only changed files
      - name: Deploy changed files via SFTP
        if: steps.changes.outputs.files != ''
        uses: appleboy/scp-action@master
        with:
          host: 217.21.84.50
          port: 65002
          username: u848820288
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "temp_deploy/"
          target: "/public_html/"
          overwrite: true
          strip_components: 1
          tar_exec: true
