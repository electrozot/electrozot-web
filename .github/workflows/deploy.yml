name: 🚀 Deploy PHP Site via SFTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Step 1 — Checkout repository
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2 — Deploy directly to Hostinger via SFTP
      - name: Deploy via SFTP
        uses: appleboy/sftp-action@v0.1.3
        with:
          host: 217.21.84.50
          port: 65002
          username: u848820288
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "./"               # upload all files in repo root
          target: "/public_html/"    # Hostinger web root
          strip_components: 0        # keep repo structure
          rm: false                  # do not delete files on server
          overwrite: true
