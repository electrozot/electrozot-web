name: 🚀 Deploy PHP Site via SFTP

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare deployment files
        run: |
          mkdir -p temp_deploy
          rsync -av --exclude='.git' --exclude='.github' --exclude='node_modules' --exclude='temp_deploy' ./ temp_deploy/

      - name: Check temp_deploy contents
        run: |
          ls -la temp_deploy

      - name: Deploy via SFTP
        uses: appleboy/scp-action@master
        with:
          host: 217.21.84.50
          port: 65002
          username: u848820288
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          source: "${{ github.workspace }}/temp_deploy/"
          target: "/public_html/"
          overwrite: true
          strip_components: 1
          tar_exec: false
