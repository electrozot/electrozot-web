name: 🚀 Deploy PHP Site via SSH/rsync

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Checkout the code
      - name: Checkout repository
        uses: actions/checkout@v4

      # Deploy with rsync over SSH
      - name: Deploy via SSH (rsync)
        uses: matsuu/ssh-deploy@v4
        with:
          # Hostinger server
          host: 217.21.84.50
          port: 65002
          username: u848820288
          key: ${{ secrets.SSH_PRIVATE_KEY }}

          # Paths
          local-dir: "./"
          remote-dir: "/public_html/"

          # Rsync options
          exclude: |
            .git
            .github
            node_modules
          rsync-options: "-avz --delete"
