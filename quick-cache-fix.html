<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quick Cache Fix</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .card {
            background: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
            text-align: center;
            max-width: 500px;
        }
        h1 { color: #333; margin-bottom: 20px; }
        button {
            background: #667eea;
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 8px;
            font-size: 18px;
            cursor: pointer;
            margin: 10px;
            transition: all 0.3s;
            width: 100%;
        }
        button:hover {
            background: #5568d3;
            transform: translateY(-2px);
        }
        .success {
            background: #10b981;
            padding: 15px;
            border-radius: 8px;
            margin-top: 20px;
            display: none;
        }
        .loading {
            display: none;
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>⚡ Quick Cache Fix</h1>
        <p>Click the button below to clear all caches and unregister service workers.</p>
        <p><strong>This will make your changes show up immediately!</strong></p>
        
        <button onclick="fixCache()">🔧 Fix Cache Issues Now</button>
        
        <div class="loading" id="loading">
            <p>⏳ Fixing cache issues...</p>
        </div>
        
        <div class="success" id="success">
            <h2>✅ Done!</h2>
            <p>Cache cleared and service worker unregistered.</p>
            <p><strong>Refresh your site to see changes!</strong></p>
        </div>
    </div>

    <script>
        async function fixCache() {
            document.getElementById('loading').style.display = 'block';
            
            try {
                // Unregister all service workers
                if ('serviceWorker' in navigator) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    for (let registration of registrations) {
                        await registration.unregister();
                    }
                }
                
                // Clear all caches
                if ('caches' in window) {
                    const cacheNames = await caches.keys();
                    for (let cacheName of cacheNames) {
                        await caches.delete(cacheName);
                    }
                }
                
                // Show success
                document.getElementById('loading').style.display = 'none';
                document.getElementById('success').style.display = 'block';
                
                // Auto reload after 2 seconds
                setTimeout(() => {
                    window.location.href = 'index.php';
                }, 2000);
                
            } catch (error) {
                alert('Error: ' + error.message);
                document.getElementById('loading').style.display = 'none';
            }
        }
    </script>
</body>
</html>
