<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responsive Text Test</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
        }
        
        .hero-section {
            background: linear-gradient(135deg, #95e3f3ff 0%, #FECDD3 25%, #a9f6ceff 50%, #f783c5ff 75%, #FED7D7 100%);
            padding: 100px 20px;
            text-align: center;
        }
        
        .hero-title {
            font-size: 4.5rem;
            color: #2d3748;
            margin-bottom: 20px;
            font-weight: 400;
        }
        
        .hero-description {
            font-size: 0.95rem;
            line-height: 1.6;
            color: #5B4A7D;
            text-shadow: 1px 1px 3px rgba(255,255,255,0.6);
            font-weight: 700;
            text-align: center;
            padding: 0 15px;
            max-width: 800px;
            margin: 0 auto 30px;
        }
        
        .hero-buttons {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
            padding: 0 15px;
        }
        
        .hero-btn {
            background: linear-gradient(135deg, #E88A77 0%, #E89BB8 50%, #A876D3 100%);
            color: #2d3748;
            padding: 12px 28px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            text-decoration: none;
            display: inline-block;
            min-width: 160px;
            text-align: center;
        }
        
        /* Tablet */
        @media (max-width: 768px) {
            .hero-title {
                font-size: 3rem !important;
                padding: 0 15px !important;
            }
            
            .hero-description {
                font-size: 0.85rem !important;
                line-height: 1.5 !important;
                padding: 0 15px !important;
            }
            
            .hero-buttons {
                gap: 10px !important;
            }
            
            .hero-btn {
                min-width: 150px !important;
                padding: 10px 20px !important;
                font-size: 0.85rem !important;
            }
        }
        
        /* Mobile */
        @media (max-width: 576px) {
            .hero-title {
                font-size: 2.5rem !important;
                padding: 0 10px !important;
            }
            
            .hero-description {
                font-size: 0.75rem !important;
                line-height: 1.5 !important;
                padding: 0 10px !important;
                word-wrap: break-word !important;
            }
            
            .hero-buttons {
                gap: 8px !important;
                padding: 0 10px !important;
            }
            
            .hero-btn {
                min-width: 140px !important;
                max-width: 48% !important;
                padding: 10px 15px !important;
                font-size: 0.8rem !important;
            }
        }
        
        /* Extra small */
        @media (max-width: 400px) {
            .hero-title {
                font-size: 2rem !important;
                padding: 0 5px !important;
            }
            
            .hero-description {
                font-size: 0.7rem !important;
                line-height: 1.4 !important;
                padding: 0 5px !important;
            }
            
            .hero-btn {
                min-width: 120px !important;
                padding: 8px 12px !important;
                font-size: 0.75rem !important;
            }
        }
        
        .screen-size {
            position: fixed;
            top: 10px;
            right: 10px;
            background: rgba(0,0,0,0.8);
            color: white;
            padding: 10px 15px;
            border-radius: 8px;
            font-size: 14px;
            z-index: 9999;
        }
    </style>
</head>
<body>
    <div class="screen-size" id="screenSize">Width: <span id="width"></span>px</div>
    
    <div class="hero-section">
        <h1 class="hero-title">Electrozot</h1>
        <p class="hero-description">
            Your Trusted Partner for electrical & plumbing services,<br>
            Quality Service & Certified Technicians.<br>
            We Deliver Perfection in Every Job.
        </p>
        <div class="hero-buttons">
            <a href="#" class="hero-btn">📱 Book Service</a>
            <a href="#" class="hero-btn">📞 7559606925</a>
        </div>
    </div>
    
    <script>
        function updateScreenSize() {
            document.getElementById('width').textContent = window.innerWidth;
        }
        
        updateScreenSize();
        window.addEventListener('resize', updateScreenSize);
    </script>
</body>
</html>
